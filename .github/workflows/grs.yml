name: Update README cards

on:
  schedule:
    - cron: "0 6 * * 0" # Runs every sunday at 6AM
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true
          path: profile/stats.svg
          token: ${{ secrets.MY_GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "ayvacs"
          git config user.email "74518502+ayvacs@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update README cards" || exit 0
          git push